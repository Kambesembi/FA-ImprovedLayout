<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root {
    color-scheme: dark;
    --bg: #17181b; --card: #1f2126; --line: #2c2f36; --text: #e2e2e6; --muted: #8c8f99;
    --accent: #e0a64b; --accent-dim: rgba(224, 166, 75, .18);
  }
  * { box-sizing: border-box; }
  body {
    width: 320px; margin: 0; background: var(--bg); color: var(--text);
    font: 13px/1.4 system-ui, "Segoe UI", sans-serif;
  }
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 16px 12px; border-bottom: 1px solid var(--line);
  }
  header h1 { margin: 0; font-size: 15px; font-weight: 650; letter-spacing: .01em; }
  header h1 small { display: block; font-size: 11px; font-weight: 400; color: var(--muted); margin-top: 1px; }
  main { padding: 10px 12px 4px; }
  fieldset { border: 0; margin: 0; padding: 0; transition: opacity .15s; }
  fieldset:disabled { opacity: .4; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 4px 12px; margin-bottom: 10px; }
  .card h2 {
    margin: 8px 0 2px; font-size: 10.5px; font-weight: 600; color: var(--muted);
    text-transform: uppercase; letter-spacing: .08em;
  }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); }
  .card h2 + .row, .card > .row:first-child { border-top: 0; }
  .row.sub-row { padding-left: 14px; }
  .row.main { padding: 10px 0; }
  .row.main b { font-size: 13.5px; font-weight: 650; }
  .card .sub { border-top: 1px solid var(--line); transition: opacity .15s; }
  .card .sub.off { opacity: .4; pointer-events: none; }
  .row.col { flex-direction: column; align-items: stretch; gap: 6px; }
  .label { display: flex; flex-direction: column; min-width: 0; }
  .label span { color: var(--muted); font-size: 11px; }
  .head { display: flex; justify-content: space-between; align-items: baseline; }
  .val { color: var(--accent); font-variant-numeric: tabular-nums; font-size: 12px; }

  /* switch */
  .switch { position: relative; flex: none; width: 34px; height: 20px; }
  .switch input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; z-index: 1; }
  .switch i { position: absolute; inset: 0; border-radius: 20px; background: #3a3d45; transition: background .15s; }
  .switch i::after {
    content: ""; position: absolute; top: 3px; left: 3px; width: 14px; height: 14px; border-radius: 50%;
    background: #c9cad0; transition: transform .15s, background .15s;
  }
  .switch input:checked + i { background: var(--accent); }
  .switch input:checked + i::after { transform: translateX(14px); background: #1b1b1d; }
  .switch input:focus-visible + i { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* range */
  input[type=range] { width: 100%; margin: 0; accent-color: var(--accent); }


  .label i { font-style: normal; }
  .hint { color: var(--muted); font-size: 10.5px; line-height: 1.3; }
  /* language: three flag buttons in the header */
  .langs { display: flex; gap: 5px; margin-left: auto; margin-right: 12px; }
  .langs button {
    width: 26px; height: 19px; padding: 0; border: 1px solid var(--line); border-radius: 4px; overflow: hidden;
    background: none; cursor: pointer; opacity: .45; transition: opacity .12s, border-color .12s;
  }
  .langs button svg { display: block; width: 100%; height: 100%; }
  .langs button:hover { opacity: .8; }
  .langs button[aria-pressed=true] { opacity: 1; border-color: var(--accent); }
  footer { display: flex; justify-content: space-between; align-items: center; padding: 4px 16px 14px; color: var(--muted); font-size: 11px; }
  footer button {
    background: transparent; color: var(--muted); border: 1px solid var(--line); border-radius: 6px;
    padding: 4px 10px; font: inherit; cursor: pointer;
  }
  footer button:hover { color: var(--text); border-color: #444; }
</style>
</head>
<body>
  <header>
    <h1>FA-ImprovedLayout<small id="version"></small></h1>
    <div class="langs" id="langs" data-i18n-title="language">
      <button data-lang="en" title="English"><svg viewBox="0 0 60 30"><clipPath id="fawuk"><path d="M30 15h30v15zv15H0zH0V0zV0h30z"/></clipPath><path d="M0 0v30h60V0z" fill="#012169"/><path d="M0 0l60 30m0-30L0 30" stroke="#fff" stroke-width="6"/><path d="M0 0l60 30m0-30L0 30" clip-path="url(#fawuk)" stroke="#C8102E" stroke-width="4"/><path d="M30 0v30M0 15h60" stroke="#fff" stroke-width="10"/><path d="M30 0v30M0 15h60" stroke="#C8102E" stroke-width="6"/></svg></button>
      <button data-lang="de" title="Deutsch"><svg viewBox="0 0 5 3"><path fill="#000" d="M0 0h5v1H0z"/><path fill="#D00" d="M0 1h5v1H0z"/><path fill="#FFCE00" d="M0 2h5v1H0z"/></svg></button>
      <button data-lang="ru" title="Русский"><svg viewBox="0 0 9 6"><path fill="#fff" d="M0 0h9v2H0z"/><path fill="#0039A6" d="M0 2h9v2H0z"/><path fill="#D52B1E" d="M0 4h9v2H0z"/></svg></button>
    </div>
    <label class="switch" data-i18n-title="masterTitle"><input type="checkbox" id="enabled"><i></i></label>
  </header>

  <main>
  <fieldset id="opts">
    <section class="card" data-group="ultrawide">
      <div class="row main">
        <div class="label"><b data-i18n="ultrawide"></b><span data-i18n="ultrawideSub"></span></div>
        <label class="switch"><input type="checkbox" id="ultrawide"><i></i></label>
      </div>
      <div class="sub">
        <div class="row col">
          <div class="head"><span data-i18n="maxWidth"></span><span class="val" id="max-v"></span></div>
          <input type="range" id="max" min="1200" max="4000" step="50">
        </div>
        <div class="row col">
          <div class="head"><span data-i18n="gutter"></span><span class="val" id="gutter-v"></span></div>
          <input type="range" id="gutter" min="0" max="300" step="4">
          <span class="hint" data-i18n="gutterHint"></span>
        </div>
        <div class="row col">
          <div class="head"><span data-i18n="thumbSize"></span><span class="val" id="thumb-v"></span></div>
          <input type="range" id="thumb" min="0.8" max="2" step="0.05">
        </div>
        <div class="row">
          <div class="label"><i data-i18n="imageFit"></i><span data-i18n="imageFitSub"></span></div>
          <label class="switch"><input type="checkbox" id="imageFit"><i></i></label>
        </div>
      </div>
    </section>

    <section class="card" data-group="design">
      <div class="row main">
        <div class="label"><b data-i18n="design"></b><span data-i18n="designSub"></span></div>
        <label class="switch"><input type="checkbox" id="design"><i></i></label>
      </div>
    </section>

    <section class="card">
      <h2 data-i18n="features"></h2>
      <div class="row">
        <div class="label"><i data-i18n="quickView"></i><span data-i18n="quickViewSub"></span></div>
        <label class="switch"><input type="checkbox" id="quickView"><i></i></label>
      </div>
      <div class="row">
        <div class="label"><i data-i18n="comic"></i><span data-i18n="comicSub"></span></div>
        <label class="switch"><input type="checkbox" id="comic"><i></i></label>
      </div>
      <div class="row sub-row">
        <div class="label"><i data-i18n="comicH"></i><span data-i18n="comicHSub"></span></div>
        <label class="switch"><input type="checkbox" id="comicHorizontal"><i></i></label>
      </div>
      <div class="row">
        <div class="label"><i data-i18n="infinite"></i><span data-i18n="infiniteSub"></span></div>
        <label class="switch"><input type="checkbox" id="infinite"><i></i></label>
      </div>
      <div class="row">
        <div class="label"><i data-i18n="topbar"></i><span data-i18n="topbarSub"></span></div>
        <label class="switch"><input type="checkbox" id="topbar"><i></i></label>
      </div>
      <div class="row">
        <div class="label"><i data-i18n="pins"></i><span data-i18n="pinsSub"></span></div>
        <label class="switch"><input type="checkbox" id="pins"><i></i></label>
      </div>
      <div class="row">
        <div class="label"><i data-i18n="bbExtra"></i><span data-i18n="bbExtraSub"></span></div>
        <label class="switch"><input type="checkbox" id="bbExtra"><i></i></label>
      </div>
      <div class="row">
        <div class="label"><i data-i18n="archive"></i><span data-i18n="archiveSub"></span></div>
        <label class="switch"><input type="checkbox" id="archiveLink"><i></i></label>
      </div>
    </section>
  </fieldset>
  </main>

  <footer>
    <span data-i18n="applyNote"></span>
    <button id="reset" data-i18n="reset"></button>
  </footer>
  <script src="i18n.js"></script>
  <script src="settings.js"></script>
  <script src="popup.js"></script>
</body>
</html>
