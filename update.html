<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>FA-ImprovedLayout – Update</title>
<link rel="icon" href="icon32.png">
<style>
  :root { color-scheme: dark; --bg: #17181b; --card: #1f2126; --line: #2c2f36; --text: #e2e2e6; --muted: #8c8f99; --accent: #e0a64b; --ok: #6fd38a; --err: #f07a7a; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--text); font: 14px/1.5 system-ui, "Segoe UI", sans-serif; display: grid; place-items: start center; padding: 6vh 16px; }
  main { width: min(640px, 100%); display: grid; gap: 14px; }
  h1 { margin: 0; font-size: 20px; display: flex; align-items: center; gap: 10px; }
  h1 img { width: 32px; height: 32px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; display: grid; gap: 10px; }
  .vers { display: flex; flex-wrap: wrap; gap: 6px 24px; }
  .vers b { color: var(--accent); }
  .hint { color: var(--muted); font-size: 12.5px; margin: 0; }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
  button { font: 600 14px/1 system-ui, "Segoe UI", sans-serif; padding: 11px 22px; border-radius: 9px; cursor: pointer; color: #1b1408; background: var(--accent); border: 1px solid var(--accent); }
  button.ghost { color: var(--text); background: transparent; border-color: var(--line); padding: 8px 14px; font-weight: 500; font-size: 13px; }
  button:disabled { opacity: .5; cursor: default; }
  a { color: var(--accent); }
  #status { min-height: 1.5em; }
  #status.ok { color: var(--ok); }
  #status.bad { color: var(--err); }
  progress { width: 100%; height: 8px; accent-color: var(--accent); }
  progress[hidden], [hidden] { display: none !important; }
  #notes { white-space: pre-wrap; max-height: 320px; overflow-y: auto; margin: 0; font: inherit; font-size: 13px; color: #cfd0d6; }
</style>
</head>
<body>
  <main>
    <h1><img src="icon128.png" alt=""><span data-i18n="updTitle"></span></h1>
    <div class="card">
      <div class="vers"><span id="cur"></span><span id="latest"></span></div>
      <p id="status"></p>
      <progress id="bar" max="1" value="0" hidden></progress>
      <div class="row">
        <button id="go" hidden></button>
        <button id="refolder" class="ghost" hidden data-i18n="updChangeFolder"></button>
        <a id="manual" href="#" target="_blank" rel="noopener" hidden data-i18n="updManual"></a>
      </div>
      <p id="folder" class="hint" hidden></p>
      <p id="howto" class="hint" hidden></p>
    </div>
    <div class="card" id="notesCard" hidden>
      <strong data-i18n="updNotes"></strong>
      <pre id="notes"></pre>
    </div>
  </main>
  <script src="i18n.js"></script>
  <script src="settings.js"></script>
  <script src="update.js"></script>
</body>
</html>
